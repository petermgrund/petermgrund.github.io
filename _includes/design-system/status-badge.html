<!--
  Reusable Status Badge Component

  Usage:
  {% include design-system/status-badge.html
     status="approved"
     text="Approved"
  %}

  Parameters:
  - status (required): draft, queue, subcommittee, revise, approved, completed, in-progress
  - text (optional): Custom text, defaults to capitalized status
-->

{% assign status = include.status | downcase %}
{% assign text = include.text | default: status | capitalize %}

<span class="status-indicator status-{{ status }}">
  {{ text }}
</span>
