<head>
  <title>Bootstrap 5 Website Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
  .fakeimg {
    height: 200px;
    background: #aaa;
  }

a {
  text-decoration: underline; 
}

a:hover {
  text-decoration: none;
}

a:focus,
button:focus {
  background-color: #fdd522 !important;
  color: #000000 !important;
  outline-offset: 0;
  transition-duration: 0s;
  box-shadow: 0 3px 0 0 black;
  text-decoration: none;
}
.icon-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem; /* Adjust spacing between icon and text */
  }

  .icon-link svg {
    width: 1em; /* Match the text size */
    height: 1em;
    vertical-align: middle;
  }

  .icon-link h3, .icon-link span {
    margin: 0; /* Reset margin for consistent spacing */
    line-height: 1; /* Align text vertically */
  }

  /* Add space between list items */
  .list-unstyled li {
    margin-bottom: 1.5rem; /* Adjust spacing as needed */
  }

  </style>
