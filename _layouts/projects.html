---
layout: default
---
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

{% if site.proj-alert %}
<div class="container p-3">
  <div class="alert alert-{{ site.proj-alert-type }}" role="alert">
    {{ site.proj-alert }} (last updated {{ site.proj-alert-date | date: "%d %b %Y" }})
  </div>
</div>
{% endif %}
      
    <div class="container">
      <div class="col-lg-6 mx p-4 py-md-5">
        <h1 class="display-3 mb-4">Projects</h1> 
        <div class="container mt-4"> 
          <div class="row">
            <ul class="list-unstyled ps-0">
            {% for project in site.projects %}
              <li>
                <a class="icon-link mb-1" href="{{ project.url }}" rel="noopener">
                  <svg class="bi"><use xlink:href="#arrow-right-circle"/></svg>
                  <h3>{{ project.title }}</h3>
                </a>
                <p>{{ project.description }}</p>

              </li>
            {% endfor %}
            </ul>
          </div>
        </div>
      </div>
    </div>
