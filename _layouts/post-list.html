---
layout: default
---
<div class="container">
  <div class="col-lg-8 mx p-4 py-md-5">
    <h1 class="display-3 mb-4">Posts</h1> 
    <div class="container mt-4"> 
      <div class="row">
        {% for post in site.posts %}
          <div class="col-md-12 mb-4">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title"><a href="{{ post.url }}">{{ post.title }}</a></h5>
                <h6 class="card-subtitle mb-2 text-muted">{{ post.date | date: "%d %b %Y" }}</h6>
                <p class="card-text">{{ post.summary}}</p>
                <div class="tags">
                  {% for tag in post.tags %}
                    <a href="/tags/{{ tag | slugify }}" class="badge rounded-pill text-bg-secondary text-decoration-none">{{ tag }}</a>
                  {% endfor %}
                </div>
              </div>
            </div>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
