---
layout: default
---
{% if site.alert %}
<div class="container p-3">
  <div class="alert alert-{{ site.alert-type }}" role="alert">
    {{ site.alert }} (last updated {{ site.alert-date | date: "%d %b %Y" }})
  </div>
</div>
{% endif %}
<div class="container p-3 py-md-5">
  <div class="row g-4">

    <!-- About -->
    <div class="col-md-6">
      <h2 class="display-3">About</h2>
      <p class="fs-5">Welcome to my website.</p>
      <div style="text-align: left;">
        <img src="{{ site.baseurl }}/assets/images/graphics/bike.svg" alt="Illustration of a person riding a bicycle" style="height: 250px;">
      </div>
    </div>

    <!-- Pages -->
    <div class="col-md-6">
      <h2 class="display-3">Pages</h2>
      <p class="fs-5">Explore the following pages about me:</p>
      <ul class="list-unstyled ps-0">
        <li>
          <a class="icon-link mb-1" href="/cv" rel="noopener">
            <svg class="bi" aria-hidden="true"><use xlink:href="#arrow-right-circle"/></svg>
            <span class="h3">CV</span>
          </a>
        </li>
        <li>
          <a class="icon-link mb-1" href="/posts" rel="noopener">
            <svg class="bi" aria-hidden="true"><use xlink:href="#arrow-right-circle"/></svg>
            <span class="h3">Posts</span>
          </a>
        </li>
        <li>
          <a class="icon-link mb-1" href="/projects" rel="noopener">
            <svg class="bi" aria-hidden="true"><use xlink:href="#arrow-right-circle"/></svg>
            <span class="h3">Projects</span>
          </a>
        </li>
        <li>
          <a class="icon-link mb-1" href="/visualizations" rel="noopener">
            <svg class="bi" aria-hidden="true"><use xlink:href="#arrow-right-circle"/></svg>
            <span class="h3">Visualizations</span>
          </a>
        </li>
        <li>
          <a class="icon-link mb-1" href="/contact" rel="noopener">
            <svg class="bi" aria-hidden="true"><use xlink:href="#arrow-right-circle"/></svg>
            <span class="h3">Contact me</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</div>
