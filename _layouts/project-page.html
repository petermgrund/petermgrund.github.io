---
layout: default
---
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<div class="breadcrumbs">
  <a href="{{ site.baseurl }}/projects"><i class="fas fa-arrow-left"></i> Projects</a>
</div>

<article class="post">

  <header class="post-header">
    <h1 class="project-title">{{ page.title | escape }}</h1>
  </header>

  {% if page.image %}
  <div style="text-align: left;">
    <img src="{{ site.baseurl }}/assets/images/graphics/{{ page.image }}" alt="Logo" style="height: 250px;">
  </div>
  {% endif %}

  <div class="project-content">
    {{ content }}
  </div>

</article>
